<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eatz Family Card</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C1121F">
<style>
:root{
  --bd:#e5e7eb; --text:#111827; --bg:#ffffff; --muted:#6b7280;
  --ok:#0f9d67; --warn:#b45309; --bad:#b91c1c; --accent:#C1121F;
  --base:20px; --lg:23px; --xl:30px; --xxl:40px;
}
html, body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:system-ui, Segoe UI, Arial, sans-serif;
  font-size:var(--base); line-height:1.8; overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
[hidden]{display:none !important;}
.wrap{max-width:760px; width:100%; box-sizing:border-box; margin:0 auto; padding:18px;}
h1{margin:0 0 12px; font-size:var(--xl); line-height:1.3;}
label{display:block; font-weight:700; margin-bottom:6px;}
input{
  box-sizing:border-box; width:100%; font:inherit; padding:12px 14px;
  border:1px solid #9ca3af; border-radius:10px; margin-bottom:16px;
}
button, .link{font:inherit; cursor:pointer;}
button.primary{
  width:100%; padding:14px; border:0; border-radius:10px;
  background:var(--accent); color:#fff; font-weight:700;
}
button:disabled{opacity:.6; cursor:default;}
button.link{background:none; border:0; padding:8px 0; color:var(--accent); text-decoration:underline;}
:focus-visible{outline:3px solid #2563eb; outline-offset:2px;}
.hint{color:var(--muted); font-size:16px; line-height:1.5;}
.error{color:var(--bad); font-size:18px; line-height:1.5; margin:0 0 12px;}
.error:empty{margin:0;}

/* card (compact on phones so the banner clock and discount fit without scrolling) */
.card{border:1px solid var(--bd); border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.06);
      overflow:hidden; display:flex; flex-direction:column; width:100%; background:#fff;}
.header{position:relative; overflow:hidden; background:var(--accent); color:#fff; padding:22px 16px; text-align:center;}
.header h2{position:relative; margin:0; font-size:30px; font-weight:900; letter-spacing:1px; text-transform:uppercase; line-height:1.3;}
.clock{position:relative; font-size:20px; font-weight:700; line-height:1.3; font-variant-numeric:tabular-nums;}
.header::after{
  content:""; position:absolute; top:0; bottom:0; left:0; width:40%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.3), transparent);
  transform:translateX(-120%); animation:shine 3s ease-in-out infinite;
}
@keyframes shine{ to{ transform:translateX(320%); } }
@media (prefers-reduced-motion: reduce){ .header::after{animation:none; display:none;} }
.content{padding:22px 18px 18px;}
.block{margin-bottom:14px;}
.val{font-size:18px; line-height:1.3; word-break:break-word; text-align:center;}
.val.name{font-size:30px; font-weight:900;}
.val.position, .val.store{font-size:22px; font-weight:700;}
.status-row{display:flex; justify-content:center;}
.status-badge{display:inline-block; padding:8px 20px; border-radius:999px; font-size:18px; line-height:1.3; font-weight:900;}
.status-badge.big{font-size:26px; padding:10px 24px;}
.s-Active{background:rgba(15,157,103,.15); color:var(--ok); border:1px solid rgba(15,157,103,.35);}
.s-Suspended{background:rgba(180,83,9,.15); color:var(--warn); border:1px solid rgba(180,83,9,.35);}
.s-Expired{background:rgba(185,28,28,.15); color:var(--bad); border:1px solid rgba(185,28,28,.35);}
.footer{padding:8px 20px; border-top:1px solid var(--bd); display:flex; flex-direction:column;
        align-items:center; text-align:center; color:var(--muted);}
@media (min-width:601px){
  .header{padding:40px 18px;}
  .header h2{font-size:var(--xxl);}
  .content{padding:40px 26px 28px;}
  .block{margin-bottom:28px;}
  .val{font-size:var(--lg);}
  .val.name{font-size:40px;}
  .val.position, .val.store{font-size:var(--xl);}
  .status-badge{font-size:22px; padding:12px 26px;}
  .status-badge.big{font-size:34px; padding:16px 32px;}
}
</style>
</head>
<body>
<main class="wrap">
  <p id="msg" class="error" aria-live="polite"></p>

  <section id="s-email" hidden>
    <h1>Eatz Family Card</h1>
    <form id="f-email">
      <label for="email">Company email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button class="primary" type="submit">Send code</button>
    </form>
    <p id="tip" class="hint" hidden>Tip: add this page to your Home Screen first, then sign in from the icon.</p>
  </section>

  <section id="s-code" hidden>
    <p>If this email is registered, a code has been sent.</p>
    <form id="f-code">
      <label for="code">6-digit code</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required>
      <button class="primary" type="submit">Verify</button>
    </form>
    <button id="back" class="link" type="button">Use a different email or resend</button>
  </section>

  <section id="s-card" hidden>
    <div class="card">
      <div class="header" id="banner"><h2 id="c-type"></h2><div class="clock" id="clock"></div></div>
      <div class="content">
        <div class="block"><div class="val name" id="c-name"></div></div>
        <div class="block"><div class="val position" id="c-position"></div></div>
        <div class="block"><div class="val store" id="c-store"></div></div>
        <div class="block"><div class="status-row"><span id="c-status" class="status-badge"></span></div></div>
        <div class="block" id="c-discount-block"><div class="val" id="c-discount"></div></div>
      </div>
      <div class="footer">
        <button id="signout" class="link" type="button">Sign out</button>
      </div>
    </div>
  </section>

  <section id="s-loading" hidden>
    <p>Loading…</p>
  </section>

  <section id="s-unable" hidden>
    <p>Unable to verify. Check your connection.</p>
    <button id="retry" class="primary" type="button">Retry</button>
  </section>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxF5vtksXz3Jtd6EvTDZwmtHWPZPg9DyXL2DlQ956v160IRDLXJuzM4ahLqI4QmhsOA/exec";
const TOKEN_KEY = "eatz_token";
const VERIFY_INTERVAL_MS = 60000;
const FRESH_MS = 90000;
const REQUEST_TIMEOUT_MS = 15000;
const RETRY_AFTER_FAIL_MS = 10000;
const PENDING_KEY = "eatz_pending";
const PENDING_TTL_MS = 600000;

const MESSAGES = {
  invalid_code: "That code is incorrect or expired. Request a new one.",
  try_later: "Can't send a code right now. Please try again later.",
  invalid_token: "Please sign in again.",
  not_found: "This card is no longer valid.",
  server: "Something went wrong. Please try again.",
};
const BANNER_COLORS = { black: "#121212", gold: "#CBA135", silver: "#6B7280" };

const $ = (id) => document.getElementById(id);
const SCREENS = ["s-email", "s-code", "s-card", "s-loading", "s-unable"];

let token = null;
let email = "";
let lastVerified = 0;
let screen = "";
let busy = false; // a form request is in flight
let checking = false; // a getCard request is in flight
let retryTimer = 0; // the one pending retry after a failed getCard

function storage(fn) { try { return fn(localStorage); } catch (e) { return null; } }
function loadToken() { return storage((s) => s.getItem(TOKEN_KEY)); }
function saveToken(t) { token = t; storage((s) => s.setItem(TOKEN_KEY, t)); }
function clearRetry() { clearTimeout(retryTimer); retryTimer = 0; }
function clearToken() { token = null; lastVerified = 0; clearRetry(); storage((s) => s.removeItem(TOKEN_KEY)); }

// Pending sign-in survives a relaunch while the user reads the code in their mail app. Never stores the code.
function savePending(e) { storage((s) => s.setItem(PENDING_KEY, JSON.stringify({ email: e, at: Date.now() }))); }
function clearPending() { storage((s) => s.removeItem(PENDING_KEY)); }
function loadPending() {
  const p = storage((s) => JSON.parse(s.getItem(PENDING_KEY)));
  const age = p ? Date.now() - p.at : NaN;
  if (p && typeof p.email === "string" && age >= 0 && age < PENDING_TTL_MS) return p.email;
  clearPending();
  return null;
}

// Card is stale when the last good check is over 90 s old, or in the future (clock set back).
function isStale() {
  const age = Date.now() - lastVerified;
  return age < 0 || age > FRESH_MS;
}

function show(name, message) {
  screen = name;
  SCREENS.forEach((id) => { $(id).hidden = id !== name; });
  $("msg").textContent = message || "";
}

// Any failure to get a clean JSON answer counts as error "server".
async function api(payload) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      signal: ctl.signal,
    });
    if (!res.ok) return { ok: false, error: "server" };
    return await res.json();
  } catch (e) {
    return { ok: false, error: "server" };
  } finally {
    clearTimeout(timer);
  }
}

function setBusy(form, on) {
  busy = on;
  form.querySelector("button").disabled = on;
}

function pad(n) { return String(n).padStart(2, "0"); }
function formatTime(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " +
    pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}

function renderCard(c) {
  const type = String(c.cardType || "").trim().toLowerCase().split(" ")[0];
  $("banner").style.background = BANNER_COLORS[type] || "#C1121F";
  $("c-type").textContent = String(c.cardType || "").toUpperCase();
  $("c-name").textContent = c.name;
  $("c-position").textContent = c.position;
  $("c-store").textContent = c.store;
  const status = ["Active", "Suspended", "Expired"].includes(c.status) ? c.status : "Expired";
  const badge = $("c-status");
  badge.textContent = status.toUpperCase();
  badge.className = "status-badge s-" + status + (status === "Active" ? "" : " big");
  const active = status === "Active";
  $("c-discount-block").hidden = !active;
  $("c-discount").textContent = active ? c.discount : "";
  $("clock").textContent = formatTime(new Date());
}

async function refreshCard() {
  if (!token || checking) return;
  checking = true;
  const sent = token;
  const sentAt = Date.now();
  const r = await api({ action: "getCard", token: sent });
  checking = false;
  if (token !== sent) { // signed out (and maybe back in) meanwhile
    if (token) refreshCard();
    return;
  }
  if (r.ok) {
    clearRetry();
    lastVerified = sentAt; // the answer is only as fresh as the question
    if (isStale()) { show("s-loading"); refreshCard(); return; } // app was suspended mid-request; ask again
    renderCard(r.card);
    if (screen !== "s-card") show("s-card");
  } else if (r.error === "invalid_token" || r.error === "not_found") {
    clearToken();
    show("s-email", MESSAGES[r.error]);
  } else if (screen === "s-card") {
    // one retry before the 90-second rule in tick() hides the card
    if (!retryTimer) retryTimer = setTimeout(() => { retryTimer = 0; refreshCard(); }, RETRY_AFTER_FAIL_MS);
  } else {
    show("s-unable");
  }
}

function signOut() {
  clearToken();
  clearPending();
  show("s-email");
}

function tick() {
  if (screen !== "s-card") return;
  $("clock").textContent = formatTime(new Date());
  if (isStale()) show("s-unable");
}

async function onEmail(ev) {
  ev.preventDefault();
  if (busy) return;
  email = $("email").value.trim();
  $("msg").textContent = "";
  setBusy(ev.target, true);
  const r = await api({ action: "requestCode", email });
  setBusy(ev.target, false);
  if (r.ok) { savePending(email); $("code").value = ""; show("s-code"); $("code").focus(); }
  else $("msg").textContent = MESSAGES[r.error] || MESSAGES.server;
}

async function onCode(ev) {
  ev.preventDefault();
  if (busy) return;
  $("msg").textContent = "";
  setBusy(ev.target, true);
  const r = await api({ action: "verifyCode", email, code: $("code").value.trim() });
  setBusy(ev.target, false);
  if (r.ok) {
    clearPending();
    saveToken(r.token);
    show("s-loading"); // never show a card until getCard succeeds
    refreshCard();
  } else $("msg").textContent = r.error === "invalid_code" ? MESSAGES.invalid_code : MESSAGES.server;
}

function init() {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  $("tip").hidden = standalone;
  $("f-email").addEventListener("submit", onEmail);
  $("f-code").addEventListener("submit", onCode);
  $("back").addEventListener("click", () => { clearPending(); show("s-email"); });
  $("signout").addEventListener("click", signOut);
  $("retry").addEventListener("click", () => { show("s-loading"); refreshCard(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden || !token) return;
    if (screen !== "s-card" || isStale()) show("s-loading");
    refreshCard();
  });
  setInterval(tick, 1000);
  setInterval(() => { if (screen === "s-card") refreshCard(); }, VERIFY_INTERVAL_MS);

  token = loadToken();
  if (token) { show("s-loading"); refreshCard(); return; }
  const pending = loadPending();
  if (pending) { email = pending; $("email").value = pending; show("s-code"); }
  else show("s-email");
}
init();
</script>
</body>
</html>
